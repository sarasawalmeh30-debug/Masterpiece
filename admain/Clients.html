<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients | TEAMLY Admin</title>
    <link rel="icon" href="../img/logo2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin-sidebar.css">
    <link rel="stylesheet" href="clients.css">
</head>
<body>
<div class="admin-layout">
    <div id="admin-sidebar-container" class="admin-sidebar-container"></div>
    <main class="admin-main clients-main">
        <header class="clients-header">
            <div><a class="back-link" href="Admin_dashboard.html"><i class="fa fa-angle-left" aria-hidden="true"></i> Dashboard</a><h1>Clients</h1><p>All client accounts and their TEAMLY activity.</p></div>
            <div class="clients-admin"><span class="avatar avatar-sm">A</span><span id="clientsAdminName">Admin</span></div>
        </header>

        <div class="clients-stats" id="clientsStats" aria-label="Client summary"><p class="clients-loading">Loading client records…</p></div>

        <section class="clients-card" aria-labelledby="clientsListTitle">
            <div class="clients-card-head">
                <div><h2 id="clientsListTitle">All clients</h2><p>Browse and manage every client record.</p></div>
                <div class="clients-controls">
                    <label class="client-search"><i class="fa fa-search" aria-hidden="true"></i><span class="sr-only">Search clients</span><input id="clientSearch" type="search" placeholder="Search clients"></label>
                    <label><span class="sr-only">Filter by status</span><select id="clientStatusFilter" class="form-control"><option value="all">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="pending">Pending</option></select></label>
                </div>
            </div>
            <div class="client-table-wrap"><table class="client-table"><thead><tr><th>Client</th><th>Joined</th><th>Projects</th><th>Requests</th><th>Paid</th><th>Status</th><th>Manage</th></tr></thead><tbody id="clientsTableBody"><tr><td colspan="7"><div class="clients-empty">Loading client records…</div></td></tr></tbody></table></div>
            <p class="clients-count" id="clientsCount" aria-live="polite"></p>
        </section>
        <div class="clients-error" id="clientsError" role="alert" hidden></div>
    </main>
</div>

<div class="client-modal" id="clientModal" role="dialog" aria-modal="true" aria-labelledby="clientModalTitle" hidden>
    <div class="client-modal-card">
        <div class="client-modal-head"><div><p class="eyebrow">CLIENT RECORD</p><h2 id="clientModalTitle">Client details</h2></div><button id="clientModalClose" class="modal-close" type="button" aria-label="Close"><i class="fa fa-times" aria-hidden="true"></i></button></div>
        <div id="clientModalBody"></div>
    </div>
</div>

<script src="Admin_data.js"></script>
<script src="admin-sidebar.js"></script>
<script src="clients.js"></script>
</body>
</html>
