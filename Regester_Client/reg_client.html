    <!-- RIGHT SIDE -->
    <section class="register-form-side">

        <div class="register-form-container">

            <div class="form-heading">
                <span class="form-eyebrow">LET'S GET STARTED</span>

                <h2>Create Your Account</h2>

                <p>Register as a Client</p>
            </div>


            <form id="clientRegisterForm" novalidate>

                <!-- Full Name -->
                <div class="register-field">
                    <label for="fullName">Full Name</label>

                    <div class="input-wrapper">
                        <i class="fa fa-user-o" aria-hidden="true"></i>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <small class="field-error" id="fullNameError"></small>
                </div>


                <!-- Email Address -->
                <div class="register-field">
                    <label for="email">Email Address</label>

                    <div class="input-wrapper">
                        <i class="fa fa-envelope-o" aria-hidden="true"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <small class="field-error" id="emailError"></small>
                </div>


                <!-- Confirm Email -->
                <div class="register-field">
                    <label for="confirmEmail">Confirm Email Address</label>

                    <div class="input-wrapper">
                        <i class="fa fa-envelope-o" aria-hidden="true"></i>

                        <input
                            type="email"
                            id="confirmEmail"
                            name="confirmEmail"
                            placeholder="Confirm your email address"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <small class="field-error" id="confirmEmailError"></small>
                </div>


                <!-- Password -->
                <div class="register-field">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <i class="fa fa-lock" aria-hidden="true"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <small class="field-error" id="passwordError"></small>
                </div>


                <!-- Confirm Password -->
                <div class="register-field">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-wrapper">
                        <i class="fa fa-lock" aria-hidden="true"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <small class="field-error" id="confirmPasswordError"></small>
                </div>


                <!-- Terms and Conditions -->
                <div class="terms-row">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the
                        <a href="../Settings/Settings.html?role=client&amp;view=terms&amp;from=register">Terms &amp; Conditions</a>
                        and
                        <a href="../Settings/Settings.html?role=client&amp;view=privacy&amp;from=register">Privacy Policy</a>.
                    </label>

                </div>

                <small class="field-error terms-error" id="termsError"></small>


                <!-- Submit -->
                <button type="submit" class="create-account-btn">Create Account<i class="fa fa-arrow-right" aria-hidden="true"></i> </button>

                <p class="form-message" id="formMessage" aria-live="polite"></p>

            </form>


            <!-- Divider -->
            <div class="register-divider">
                <span></span>
                <img src="../img/logo2.png" width="50px">
                <span></span>
            </div>


            <!-- Login -->
            <div class="register-login">
                <span>Already have an account?</span>
                <a href="../login/login.html">Login</a>
            </div>

        </div>

    </section>
