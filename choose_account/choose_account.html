<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose Account Type | TEAMLY</title>

<!-- Shared CSS -->
<link rel="stylesheet" href="../style.css">

<!-- Page CSS -->
<link rel="stylesheet" href="choose_account.css">

<!-- Font Awesome 4.7 -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    <main class="account-page">

    <section class="account-container">

        <!-- Logo -->
        <div class="logo-container">
            <a href="../home_page/home.html" aria-label="TEAMLY home">
            <img src="../img/logo3.png" alt="TEAMLY Logo" class="teamly-logo" width="190px" height="100px">
            </a>
        </div>

        <!-- Heading -->
        <div class="account-heading">
            <h1>Create Your TEAMLY Account</h1>
            <p class="question">How do you want to use TEAMLY?</p>
        </div>

        <!-- Account Types -->
        <div class="account-options">

            <!-- Client Card -->
            <div class="account-card">

                <div class="account-icon">
                    <i class="fa fa-user" aria-hidden="true"></i>
                </div>

                <h2>Client</h2>

                <p>Find the right team for your project.</p>

                <a href="../Regester_Client/reg_client.html"
                   class="account-button">
                    Continue as Client
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                </a>

            </div>

            <!-- Provider Card -->
            <div class="account-card">

                <div class="account-icon">
                    <i class="fa fa-briefcase" aria-hidden="true"></i>
                </div>

                <h2>Provider</h2>

                <p>Offer your services and join project teams.</p>

                <a href="../Provider/Provider_Register.html"
                   class="account-button">
                    Continue as Provider
                    <i class="fa fa-arrow-right" aria-hidden="true"></i>
                </a>

            </div>

        </div>

        <!-- Divider -->
        <div class="account-divider">
            <span>               </span>
            <img src="../img/logo2.png" width="50px">
            <span></span>
        </div>

        <!-- Login Link -->
        <div class="login-prompt">
            <p>Already have an account?</p>
            <a href="../login/login.html">Login</a>
        </div>

    </section>

</main>

<script src="choose_account.js"></script>

</body>
</html>
